# fly.toml app configuration file generated for webbinghub-apetit-server on 2026-06-11T16:20:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'webbinghub-apetit-server'
primary_region = 'fra'

[build]

[deploy]
  release_command = 'python -m app.seed'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
